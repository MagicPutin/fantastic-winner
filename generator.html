<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор персональных приглашений | Иван & Юлия (Панель авторов)</title>

  <!-- Google Fonts: Montserrat & Cormorant Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <style>
    body {
      background-color: var(--color-bg);
      padding: 2.5rem 1rem 4rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    /* Auth Screen Card */
    .auth-card {
      background: #FFFFFF;
      border: 1px solid var(--color-card-border);
      border-radius: var(--radius-xl);
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-card);
      margin: auto 0;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }

    .auth-icon {
      font-size: 2.75rem;
      margin-bottom: 1rem;
      display: inline-block;
    }

    .auth-title {
      font-family: var(--font-heading);
      font-size: 1.85rem;
      color: var(--color-primary);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .auth-subtitle {
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--color-text-muted);
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .auth-error {
      color: #c92a2a;
      background: #ffe3e3;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      margin-bottom: 1.25rem;
      display: none;
      border: 1px solid #ffa8a8;
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Main Admin Card Styles (Applied when decrypted) */
    .admin-card {
      background: #FFFFFF;
      border: 1px solid var(--color-card-border);
      border-radius: var(--radius-xl);
      padding: 3rem 2.5rem;
      max-width: 820px;
      width: 100%;
      box-shadow: var(--shadow-card);
      margin: 0 auto;
      animation: fadeIn 0.4s ease;
    }

    .admin-header {
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--color-card-border);
      padding-bottom: 1.5rem;
      position: relative;
    }

    .admin-badge {
      display: inline-block;
      background: var(--color-primary-light);
      color: var(--color-primary);
      padding: 0.35rem 0.95rem;
      border-radius: var(--radius-pill);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .admin-logout-btn {
      position: absolute;
      right: 0;
      top: 0;
      background: var(--color-bg);
      border: 1px solid var(--color-card-border);
      color: var(--color-text-muted);
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius-pill);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .admin-logout-btn:hover {
      background: #ffe3e3;
      color: #c92a2a;
      border-color: #ffa8a8;
    }

    .admin-title {
      font-family: var(--font-heading);
      font-size: 2.1rem;
      color: var(--color-primary);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .admin-subtitle {
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--color-text-muted);
    }

    .base-domain-box {
      background: var(--color-bg);
      border: 1px solid var(--color-card-border);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
    }

    .base-domain-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .base-domain-label {
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--color-primary-dark);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-reset-domain {
      background: none;
      border: none;
      color: var(--color-primary);
      font-size: 0.82rem;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }

    .btn-reset-domain:hover {
      color: var(--color-primary-hover);
    }

    .type-switcher {
      display: flex;
      gap: 0.75rem;
      background: var(--color-bg);
      padding: 0.4rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--color-card-border);
      margin-bottom: 2rem;
    }

    .type-tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-pill);
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .type-tab-btn.active {
      background: #FFFFFF;
      color: var(--color-primary);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-card-border);
    }

    .presets-wrap {
      margin-top: 0.75rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .preset-chip {
      background: var(--color-bg);
      border: 1px solid var(--color-card-border);
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius-pill);
      font-size: 0.82rem;
      color: var(--color-primary-dark);
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .preset-chip:hover {
      background: var(--color-primary-light);
      border-color: var(--color-primary);
      transform: translateY(-2px);
    }

    .result-box {
      background: var(--color-bg);
      border: 1px solid var(--color-card-border);
      border-radius: var(--radius-sm);
      padding: 1rem 1.25rem;
      font-family: monospace;
      font-size: 0.88rem;
      color: var(--color-primary-dark);
      word-break: break-all;
      overflow-wrap: anywhere;
      margin: 0.75rem 0 1.5rem;
      user-select: all;
    }

    .message-preview {
      background: var(--color-bg);
      border-left: 4px solid var(--color-primary);
      border-radius: var(--radius-sm);
      padding: 1.25rem;
      font-size: 0.92rem;
      color: var(--color-text);
      white-space: pre-wrap;
      line-height: 1.6;
      margin: 0.75rem 0 1.75rem;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      transition: var(--transition-fast);
      margin-top: 1rem;
    }

    .back-link:hover {
      color: var(--color-primary-hover);
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .admin-card {
        padding: 2rem 1.25rem;
      }
      .admin-title {
        font-size: 1.65rem;
      }
      .type-switcher {
        flex-direction: column;
        border-radius: var(--radius-lg);
      }
      .admin-logout-btn {
        position: static;
        margin-bottom: 1rem;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================================
       PASSWORD AUTHENTICATION SCREEN (ALWAYS VISIBLE UNTIL DECRYPTED)
       ========================================================================= -->
  <div class="auth-card" id="auth-screen">
    <div class="auth-icon">🔒</div>
    <h1 class="auth-title">Доступ ограничен</h1>

    <div class="auth-error" id="auth-error-msg">Неверная кодовая фраза. Попробуйте еще раз.</div>

    <form id="auth-form" style="display: flex; flex-direction: column; gap: 1rem;">
      <input type="password" id="auth-password-input" class="form-input-pill"
        placeholder="Введите кодовую фразу..." autocomplete="current-password" autofocus required>
      <button type="submit" class="btn btn-primary" id="auth-submit-btn" style="width: 100%; justify-content: center;">
        <span id="auth-btn-spinner" class="spinner" style="display: none;"></span>
        <span id="auth-btn-text">Расшифровать и войти</span>
        <span>→</span>
      </button>
    </form>
  </div>

      function base64ToUint8Array(base64) {
        const binaryString = atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes;
      }

      async function decryptPayload(password, base64Payload) {
        const combined = base64ToUint8Array(base64Payload);
        const salt = combined.slice(0, 16);
        const iv = combined.slice(16, 28);
        const dataWithTag = combined.slice(28);

        const passwordBuffer = new TextEncoder().encode(password);
        const keyMaterial = await crypto.subtle.importKey(
          'raw',
          passwordBuffer,
          'PBKDF2',
          false,
          ['deriveKey']
        );

        const key = await crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: salt,
            iterations: 100000,
            hash: 'SHA-256'
          },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        const decryptedBuffer = await crypto.subtle.decrypt(
          {
            name: 'AES-GCM',
            iv: iv
          },
          key,
          dataWithTag
        );

        return new TextDecoder().decode(decryptedBuffer);
      }

          });
        }

        if (openBtn) {
          openBtn.addEventListener('click', () => {
            const data = updateData();
            window.open(data.url, '_blank');
          });
        }

        updateData();
      }
    })();
  </script>
</body>

</html>
