<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D6"/>
      <stop offset="25%" stop-color="#DFBA5A"/>
      <stop offset="60%" stop-color="#9E6E13"/>
      <stop offset="100%" stop-color="#F4DB8F"/>
    </linearGradient>
    <linearGradient id="gold2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#805608"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#4A1E23" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left Ring -->
  <circle cx="26" cy="34" r="17" fill="none" stroke="url(#gold1)" stroke-width="5.5" filter="url(#shadow)"/>
  
  <!-- Right Ring Intersecting -->
  <circle cx="38" cy="30" r="17" fill="none" stroke="url(#gold2)" stroke-width="5.5" filter="url(#shadow)"/>

  <!-- Left Ring Overlap Top Arch to create clean interlock effect -->
  <path d="M 26 17 A 17 17 0 0 1 43 34" fill="none" stroke="url(#gold1)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Diamond on Left Ring -->
  <polygon points="26,8 30.5,13.5 26,19 21.5,13.5" fill="#E8F4F8" stroke="#89C4E1" stroke-width="0.8"/>
  <polygon points="26,8 28.5,13.5 26,19 23.5,13.5" fill="#FFFFFF"/>
  <circle cx="26" cy="13.5" r="1.5" fill="#FFFFFF"/>

  <!-- Golden Shimmer Sparkle Top Right -->
  <path d="M 48 11 Q 48 16 53 16 Q 48 16 48 21 Q 48 16 43 16 Q 48 16 48 11 Z" fill="#FFE875"/>
</svg>
