      const privateScreen = document.getElementById('private-access-screen');
      const privateDesc = document.getElementById('private-screen-desc');
      const siteWrapper = document.getElementById('site-wrapper');

      function base64ToUint8Array(base64) {
        const binaryString = atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes;
      }

      async function decryptSitePayload(keyString, base64Payload) {
        const combined = base64ToUint8Array(base64Payload);
        const salt = combined.slice(0, 16);
        const iv = combined.slice(16, 28);
        const dataWithTag = combined.slice(28);

        const keyMaterial = await crypto.subtle.importKey(
          'raw',
          new TextEncoder().encode(keyString),
          'PBKDF2',
          false,
          ['deriveKey']
        );

        const key = await crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: salt,
            iterations: 100000,
            hash: 'SHA-256'
          },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        const decryptedBuffer = await crypto.subtle.decrypt(
          {
            name: 'AES-GCM',
            iv: iv
          },
          key,
          dataWithTag
        );

        return new TextDecoder().decode(decryptedBuffer);
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = src;
          s.async = false;
          s.onload = resolve;
          s.onerror = reject;
          document.body.appendChild(s);
        });
      }

      async function initSite() {
        const params = new URLSearchParams(window.location.search);
        const accessKey = params.get('k') || params.get('key');

        if (!accessKey) {
          if (privateScreen) privateScreen.style.display = 'flex';
          return;
        }

        try {
          const decryptedHtml = await decryptSitePayload(accessKey, ENCRYPTED_SITE_PAYLOAD);

          siteWrapper.innerHTML = decryptedHtml;
          siteWrapper.style.display = 'block';
          if (privateScreen) privateScreen.style.display = 'none';

          await loadScript('assets/js/app.js?v=3.2');
          await loadScript('assets/js/countdown.js?v=3.2');
          await loadScript('assets/js/rsvp.js?v=3.2');
          await loadScript('https://web3forms.com/client/script.js');

        } catch (err) {
          console.warn('Access key verification failed:', err);
          if (privateScreen) privateScreen.style.display = 'flex';
          if (privateDesc) {
            privateDesc.innerHTML = 'Ключ приглашения недействителен или ссылка повреждена.<br>Пожалуйста, перепроверьте ссылку из сообщения от молодоженов.';
          }
        }
      }

      initSite();
    })();
  </script>
</body>

</html>
